<!doctype html>
<!-- Vorlage für das Vorschaubild eines Blogbeitrags (1200 × 630), Fassung 4. Titel und Rubrik setzt tools/og_bild.py. -->
<html lang="de">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "DM Sans"; font-weight: 400 700; src: url("../assets/fonts/dm-sans-latin-var.woff2") format("woff2"); }
  html, body { margin: 0; }
  body { width: 1200px; height: 630px; background: #fbf7f8; color: #111827; font-family: "DM Sans", sans-serif;
    display: grid; grid-template-rows: auto 1fr auto; padding: 52px 64px; box-sizing: border-box; overflow: hidden; }
  .kopf { display: flex; justify-content: space-between; align-items: center; }
  .marke { display: inline-flex; align-items: center; gap: 14px; font-weight: 600; font-size: 38px; letter-spacing: -0.02em; }
  .rubrik { font-weight: 600; font-size: 26px; color: #b8336a; }
  .titel { align-self: center; font-weight: 500; font-size: 84px; line-height: 1.05; letter-spacing: -0.03em; max-width: 1040px; }
  .fuss { font-size: 24px; color: #5f6672; }
</style>
</head>
<body>
  <div class="kopf"><span class="marke"><svg width="44" height="44" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="#b8336a"/><path d="M9.5 24.5V7.5" fill="none" stroke="#f2b8cf" stroke-width="3.6" stroke-linecap="round"/><path d="M9.5 8l9.5 15 6.2-14.5" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/></svg> Nextfix</span><span class="rubrik" id="rubrik">Ratgeber</span></div>
  <div class="titel" id="titel">Titel</div>
  <div class="fuss">the-neyro.github.io/blog · kostenloses SEO-Tool, läuft auf deinem Rechner</div>
</body>
</html>
